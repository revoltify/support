name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        pest: ['3', '4']
        exclude:
          - php: '8.2'
            pest: '4'

    name: PHP ${{ matrix.php }} - Pest ${{ matrix.pest }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Select Pest version
        run: composer require --dev "pestphp/pest:^${{ matrix.pest }}.0" --no-update

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: highest

      - name: Check code style
        run: composer pint -- --test

      - name: Run static analysis
        run: composer stan

      - name: Run tests
        run: composer test
